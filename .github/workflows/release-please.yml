name: Semantic Release

# Reusable workflow: semantic versioning via release-please (conventional commits).
# Call it from a repo with a .release-please-manifest.json and conventional commit messages.

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '20'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: simple
