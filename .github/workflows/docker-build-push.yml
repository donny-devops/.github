name: Docker Build & Push

# Reusable workflow: Multi-platform Docker build, GHCR push, SBOM attestation & Trivy scan
# Call it from any donny-devops repository:
#
# jobs:
#   docker:
#     uses: donny-devops/.github/.github/workflows/docker-build-push.yml@main
#     with:
#       image-name: ${{ github.repository }}
#       push: ${{ github.ref == 'refs/heads/main' }}

on:
  workflow_call:
    inputs:
      image-name:
        description: 'Image name (e.g. donny-devops/node-ts-api-gateway or ${{ github.repository }})'
        type: string
        required: true
      registry:
        description: 'Target container registry'
        type: string
        default: 'ghcr.io'
      dockerfile:
        description: 'Path to Dockerfile'
        type: string
        default: 'Dockerfile'
      context:
        description: 'Docker build context path'
        type: string
        default: '.'
      platforms:
        description: 'Platforms to build for (e.g. linux/amd64,linux/arm64)'
        type: string
        default: 'linux/amd64,linux/arm64'
      push:
        description: 'Whether to push built image to registry'
        type: boolean
        default: false
      enable-trivy:
        description: 'Run Trivy vulnerability scan on built image'
        type: boolean
        default: true
    secrets:
      registry-token:
        description: 'Registry token (defaults to GITHUB_TOKEN if not provided)'
        required: false

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Registry
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.registry-token || secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.registry }}/${{ inputs.image-name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Run Trivy vulnerability scan
        if: inputs.enable-trivy && inputs.push
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ inputs.registry }}/${{ inputs.image-name }}:latest
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Upload Trivy SARIF results
        if: inputs.enable-trivy && inputs.push && always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-container
